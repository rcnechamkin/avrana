# Offline tests and the content gate. Decision D-8 (Media 2.0 Sprint 1), amended by D-8a (owner, 2026-10-14)
# and D-8b (owner, 2026-10-26, AVR-757).
# Actions billing is blocked (2026-10-15): this workflow has not run on GitHub; local runs are the evidence.
# Merging this file is the approval. It reads the repository and runs the offline suites;
# it uses no secrets, has no network dependency beyond fetching the two pinned actions, Python and the
# hash-pinned wheels in .github/requirements-ci.txt (D-8a: PyYAML; D-8b: pytest, FastAPI and the other web
# and connector test dependencies), and has no step that touches the host.
# tests/test_ci_workflow.py enforces those properties.
#
# Runner needs (see docs/DEVELOPMENT.md): python 3.12, git, sh and the pinned wheels. Nothing else. The
# suites bind no sockets beyond loopback, call no docker, rclone, zstd or curl, and use sqlite3 from the
# standard library.
name: offline-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  # The G1 compose and bypass-path tests need PyYAML; without it run_offline.py fails instead of skipping.
  AVRANA_REQUIRE_YAML: "1"

jobs:
  offline-tests:
    name: python tests/run_offline.py
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Python version
        run: python --version
      # D-8a/D-8b: only the hash-pinned wheels in requirements-ci.txt (and the avrana-home lock it includes);
      # pip refuses anything unhashed, a source build or an unlisted dependency.
      - name: Install the hash-pinned test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes -r .github/requirements-ci.txt
      - name: Run every offline suite
        run: python -B tests/run_offline.py
      # Second run inside an empty network namespace (loopback only). If any suite quietly needs the
      # network, this step fails while the one above passes, which names the cause.
      - name: Run again with networking removed
        run: |
          sudo env "PATH=$PATH" AVRANA_REQUIRE_YAML=1 unshare --net -- sh -c 'ip link set lo up && exec setpriv --reuid "$1" --regid "$2" --clear-groups -- env "PATH=$PATH" python -B tests/run_offline.py' sh "$(id -u)" "$(id -g)"

  content-gate:
    name: python scripts/review_git_content.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # The script reviews every blob in the index. A fresh checkout's index is the full tree of the
      # commit under test (for a pull request, the merge result), so --staged is the right mode here.
      - name: Review repository content
        run: python -B scripts/review_git_content.py --staged
