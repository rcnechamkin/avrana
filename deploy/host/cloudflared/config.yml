  - hostname: request.avrana.net
    service: http://localhost:5055      # Seerr (container)

  - hostname: requestacomic.avrana.net
    service: http://10.0.0.218:5058     # Omnibus (native Authentik OIDC)

  - hostname: requestabook.avrana.net
    service: http://10.0.0.218:5056     # Shelfarr (native Authentik OIDC)

  - hostname: listen.avrana.net
    service: http://10.0.0.218:13378  # Audiobookshelf (LAN-bound container)

  - hostname: auth.avrana.net
    service: http://localhost:9000    # Authentik identity provider

  - hostname: contribute.avrana.net
    service: http://localhost:8092    # Avrana Audible Connector (OIDC-gated)

  - hostname: books.avrana.net
    service: http://10.0.0.218:8083   # Calibre-Web-Automated (LDAP login via Authentik)

  - hostname: avrana.net
    service: http://localhost:9000    # Avrana portal (Authentik embedded outpost, gated by
