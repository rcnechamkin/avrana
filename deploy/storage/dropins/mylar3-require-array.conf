# Install to: /etc/systemd/system/mylar3.service.d/require-array.conf
#
# CLASSIFICATION: must not start without the array.
#
# config.ini points at the array for both its cache and its library:
#     cache_dir       = /mnt/avrana_media/mylar3/cache
#     destination_dir = /mnt/avrana_media/comics
#
# Proven on 2026-08-30: started at 18:43 with the array absent, called
# validateAndCreateDirectory() on the DDL path and died with
#     UnboundLocalError: cannot access local variable 's_perms'
# -- an upstream bug in filechecker.py that masks the real error, because s_perms is never assigned
# when the path cannot be stat'd. Five restarts later systemd hit "Start request repeated too
# quickly" and gave up, so Mylar3 stayed down even after the array came back and needed an explicit
# `systemctl reset-failed` before it would start.
#
# This dependency prevents the crash loop at its source. If Mylar3 ever does exhaust its rate
# limiter for some other reason, remember that `systemctl start` alone will not work:
#     sudo systemctl reset-failed mylar3.service && sudo systemctl start mylar3.service
#
# See deploy/docker/INCIDENT-2026-08-30.md, fault 4.
[Unit]
RequiresMountsFor=/mnt/avrana_media
