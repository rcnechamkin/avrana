# Install to: /etc/systemd/system/sabnzbd.service.d/require-array.conf
#
# CLASSIFICATION: must not start without the array.
#
# sabnzbd.ini points both working directories at the array:
#     download_dir = /mnt/avrana_media/incoming/incomplete
#     complete_dir = /mnt/avrana_media/incoming
#
# SABnzbd creates a missing download directory rather than refusing to start. With the array
# unmounted those paths are ordinary directories on the root LV, which has ~20G free -- so an
# unattended queue would download Usenet content straight into the root filesystem until the host
# runs out of space. Unlike the Docker fault this one is not merely confusing; it can take the
# whole machine down, and the data written there is invisible once the array is mounted over it.
#
# A graceful skip is not appropriate for a long-running daemon: there is no "run" to skip, and
# SABnzbd would simply misbehave for as long as it stayed up. It must not start at all.
#
# See deploy/docker/INCIDENT-2026-08-30.md and deploy/storage/ENCLOSURE-MIGRATION.md.
[Unit]
RequiresMountsFor=/mnt/avrana_media
