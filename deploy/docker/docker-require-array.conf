# Install to: /etc/systemd/system/docker.service.d/require-array.conf
#
# Docker's data-root is /mnt/avrana_media/docker. Without the array mounted that path is a plain
# directory on the root LV, and dockerd will initialise an empty state there -- the stack looks
# catastrophically empty while the real data sits fine on an unmounted disk. This happened on
# 2026-08-30 (and, per timestamps in the abandoned stub, twice on 2026-08-28 unnoticed).
#
# fstab already carried `x-systemd.before=docker.service`, but only on the mergerfs line. When the
# array is absent that mount fails its dependency and drops out of the transaction, taking the only
# ordering edge with it, and docker starts anyway. Ordering is not a requirement.
#
# RequiresMountsFor adds both Requires= and After= on mnt-avrana_media.mount, so systemd refuses to
# start Docker at all if the array did not mount. `nofail` in fstab does not interfere: it governs
# the local-fs.target dependency, not whether the .mount unit exists.
#
# See deploy/docker/INCIDENT-2026-08-30.md, fault 1.
[Unit]
RequiresMountsFor=/mnt/avrana_media
