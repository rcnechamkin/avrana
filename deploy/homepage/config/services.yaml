- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://10.0.0.218:8096
        description: Movies and television
        server: local
        container: jellyfin
        siteMonitor: http://10.0.0.218:8096/health
        widget:
          type: jellyfin
          url: http://10.0.0.218:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 1
          fields: ["movies", "series", "episodes", "songs"]
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          showEpisodeNumber: true
    - Seerr:
        icon: jellyseerr.png
        href: http://10.0.0.218:5055
        description: Media requests
        server: local
        container: seerr
        siteMonitor: http://10.0.0.218:5055/api/v1/status
        widget:
          type: seerr
          url: http://10.0.0.218:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          fields: ["pending", "approved", "processing", "available"]

    - Tracearr:
        icon: tracearr.png
        href: http://10.0.0.218:5057
        description: Jellyfin playback analytics
        server: local
        container: tracearr
        siteMonitor: http://10.0.0.218:5057/health
        widget:
          type: tracearr
          url: http://10.0.0.218:5057
          key: "{{HOMEPAGE_VAR_TRACEARR_KEY}}"
          # "both" = summary counters plus the active-session list. The summary
          # fields are fixed upstream: streams / transcodes / directplay /
          # bitrate -- which is precisely the direct-play-vs-transcode signal
          # this service was deployed for.
          view: both
          enableUser: true
          showEpisodeNumber: true

- Books & Comics:
    - Audiobookshelf:
        icon: audiobookshelf.png
        href: http://10.0.0.218:13378
        description: Audiobook library
        server: local
        container: audiobookshelf
        siteMonitor: http://10.0.0.218:13378/healthcheck
        widget:
          type: audiobookshelf
          url: http://10.0.0.218:13378/audiobookshelf
          key: "{{HOMEPAGE_VAR_ABS_KEY}}"
          fields: ["books", "booksDuration", "podcasts", "podcastsDuration"]
    - Komga:
        icon: komga.png
        href: http://10.0.0.218:25600
        description: Comics library
        server: local
        container: komga
        siteMonitor: http://10.0.0.218:25600/actuator/health
        widget:
          type: komga
          url: http://10.0.0.218:25600
          key: "{{HOMEPAGE_VAR_KOMGA_KEY}}"
          version: 1
          fields: ["libraries", "series", "books"]
    - Request Comics:
        icon: mdi-book-search-outline
        href: https://requestacomic.avrana.net
        description: Comic discovery and requests
        server: local
        container: omnibus
        # No native homepage widget for Omnibus; link + health + container
        # stats, same pattern as BookStack/Shelfarr. /api/health returns 401
        # unauthenticated, which still proves the app is serving, so the root
        # path is used for the monitor instead.
        siteMonitor: http://10.0.0.218:5058/
    - Calibre-Web Automated:
        icon: calibre-web.png
        href: http://10.0.0.218:8083
        description: Ebook library and ingest
        server: local
        container: calibre-web-automated
        siteMonitor: http://10.0.0.218:8083
        widget:
          type: calibreweb
          url: http://10.0.0.218:8083
          username: "{{HOMEPAGE_VAR_CWA_USER}}"
          password: "{{HOMEPAGE_VAR_CWA_PASSWORD}}"
          fields: ["books", "authors", "categories", "series"]

- Automation:
    - Shelfmark:
        icon: mdi-bookshelf
        href: http://10.0.0.218:8084
        description: Book search and requests
        server: local
        container: shelfmark
        siteMonitor: http://10.0.0.218:8084/api/health
    - Shelfarr:
        icon: mdi-book-search
        href: http://10.0.0.218:5056
        description: Book requests and monitoring
        server: local
        container: shelfarr
        # Rails native readiness endpoint: 200 only once the app AND its
        # database are up. gethomepage has no native shelfarr widget, so this
        # is link + siteMonitor + container stats, same as BookStack.
        siteMonitor: http://10.0.0.218:5056/up
    - Libation:
        icon: mdi-book-arrow-down
        href: http://10.0.0.218:13378
        description: Audible → M4B liberation
        server: local
        container: libation
        widget:
          type: customapi
          url: http://10.0.0.218:8087
          refreshInterval: 10000
          method: GET
          mappings:
            - field: downloaded
              label: Downloaded
              format: number
            - field: pending
              label: Pending
              format: number
            - field: library
              label: Library
              format: number
            - field: state
              label: State
              format: text
    - Audible Connector:
        icon: mdi-account-music
        href: https://contribute.avrana.net
        description: Audible → Audiobookshelf contributions
        server: local
        container: avrana-audible-connector
        siteMonitor: http://10.0.0.218:8092/healthz
        widget:
          type: customapi
          url: http://10.0.0.218:8092/status/summary
          refreshInterval: 30000
          method: GET
          mappings:
            - field: profiles
              label: Profiles
              format: number
            - field: pending
              label: To download
              format: number
            - field: downloading
              label: Downloading
              format: number
            - field: imported
              label: Imported
              format: number
    - Radarr:
        icon: radarr.png
        href: http://10.0.0.218:7878
        description: Movie automation
        server: local
        container: radarr
        siteMonitor: http://10.0.0.218:7878/ping
        widget:
          type: radarr
          url: http://10.0.0.218:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          fields: ["wanted", "missing", "queued", "movies"]
          enableQueue: true
    - Sonarr:
        icon: sonarr.png
        href: http://10.0.0.218:8989
        description: Television automation
        server: local
        container: sonarr
        siteMonitor: http://10.0.0.218:8989/ping
        widget:
          type: sonarr
          url: http://10.0.0.218:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          fields: ["wanted", "queued", "series"]
          enableQueue: true
    - Prowlarr:
        icon: prowlarr.png
        href: http://10.0.0.218:9696
        description: Indexer management
        server: local
        container: prowlarr
        siteMonitor: http://10.0.0.218:9696/ping
        widget:
          type: prowlarr
          url: http://10.0.0.218:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
          fields: ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs", "numberOfFailQueries"]
    - SABnzbd:
        icon: sabnzbd.png
        href: http://10.0.0.218:8082
        description: Usenet downloads
        siteMonitor: http://10.0.0.218:8082
        widget:
          type: sabnzbd
          url: http://10.0.0.218:8082
          key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
          fields: ["rate", "queue", "timeleft"]
    - Mylar3:
        icon: mylar.png
        href: http://10.0.0.218:8090
        description: Comics automation
        siteMonitor: http://10.0.0.218:8090
        widget:
          type: mylar
          url: http://10.0.0.218:8090
          key: "{{HOMEPAGE_VAR_MYLAR_KEY}}"
          fields: ["series", "issues", "wanted"]

