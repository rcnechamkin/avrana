# ---------------------------------------------------------------------------
# Calibre-Web-Automated (CWA) -- ebook library + one-click Send to Kindle.
#
# Role in the stack: this is the INGEST CONSUMER that Shelfmark's /books
# destination was always waiting for. Shelfmark writes epubs to
# /mnt/avrana_media/books; CWA watches that same path as its ingest inbox,
# imports each book (metadata + cover), files it into the Calibre library, and
# DELETES the source from the inbox. So /mnt/avrana_media/books is now a
# transient inbox, NOT a permanent store -- the real library lives at
# /mnt/avrana_media/calibre-library.
#
# Why CWA specifically: it fixes UTF-8 / hyperlink issues that make Amazon
# reject EPUBs, and has a built-in Send-to-Kindle (email) button -- which is
# the whole reason we added it, after the Audiobookshelf app -> iOS share ->
# Kindle path failed with "incompatible file type".
#
# Pinned to v4.0.8 (Sep 2026) rather than :latest. CWA is actively maintained,
# but this host pins deliberately so an unattended pull can't change behaviour
# under us -- bump on purpose. Valid registry tags use a lowercase 'v' prefix.
#
# Lives here (avrana/services/<name>/) per the house convention. services/ is
# gitignored, so ./config is not committed -- keep it that way.
# ---------------------------------------------------------------------------

services:
  calibre-web-automated:
    # Avrana image = upstream crocodilestick/calibre-web-automated:v4.0.8 + a build-time patch
    # for clean Kindle titles (MIME attachment filename = "{title}.epub"; see ./Dockerfile and
    # ./avrana-patch/). Bump the FROM tag in ./Dockerfile and this pin together, on purpose.
    build:
      context: .
      dockerfile: Dockerfile
    image: avrana-calibre-web-automated:v4.0.8-kindlefilename
    container_name: calibre-web-automated
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    tmpfs:
      # Calibre conversion helpers may execute temporary artifacts.
      - /tmp:rw,exec,nosuid,nodev,size=2g
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0

    # linuxserver-style image -> PUID/PGID (matches audiobookshelf, komga,
    # etc.). Every mounted path below is already cody-owned (1000:1000).
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles

      # Local ext4 on /dev/sdb1, not an NFS/SMB share -> leave false. Setting
      # this true is only for network shares and changes file-locking/ingest
      # behaviour; it would be wrong here.
      - NETWORK_SHARE_MODE=false

      # Hardcover = CWA's primary metadata provider (Kobo is the fallback; order set in
      # cwa.db metadata_provider_hierarchy). The token is the SAME one Shelfmark uses; its
      # VALUE lives in the gitignored ./.env (HARDCOVER_TOKEN=...), NOT here — this
      # docker-compose.yml is tracked in git. Reads at container start via variable
      # substitution; `:-` keeps `up` working if .env is absent.
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN:-}

    volumes:
      # App data, logs, CWA settings, and the auto-created Calibre config.
      - ./config:/config

      # INGEST INBOX -- the exact path Shelfmark writes to. CWA consumes and
      # then deletes files here after import. Do NOT point anything at this
      # expecting files to persist.
      - /mnt/avrana_media/books:/cwa-book-ingest

      # The Calibre library (metadata.db + organised book files). CWA
      # auto-creates it on first boot if the dir is empty. On the 7.3T array,
      # NOT the rootfs.
      - /mnt/avrana_media/calibre-library:/calibre-library

    # 8083 is the CWA default and is free on this host (verified against the
    # ports already in use: 8080/8084/8090/8096/8240/8989/9696/13378).
    ports:
      - 10.0.0.218:8083:8083

    # default = CWA's own network; avrana-ldap = shared with the Authentik LDAP outpost
    # (container "authentik-ldap") so CWA reaches LDAP on :3389 without it touching the LAN.
    networks:
      - default
      - avrana-ldap

    healthcheck:
      # Root redirects to /login (302); curl -sf treats 3xx as success and
      # only fails on >=400, so this confirms the web app is serving.
      test: ["CMD", "curl", "-sf", "http://localhost:8083/"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

    logging:

      driver: json-file

      options:

        max-size: "50m"

        max-file: "5"

    restart: unless-stopped

networks:
  default:
  avrana-ldap:
    external: true

# ---------------------------------------------------------------------------
# First-run:
#   1. http://10.0.0.218:8083  -> log in with admin / admin123
#   2. CHANGE THE ADMIN PASSWORD IMMEDIATELY (Admin -> Edit Users). Default
#      creds are public knowledge. LAN-only here (not published via the
#      cloudflared tunnel, same posture as shelfmark/audiobookshelf), but the
#      default password still goes. (History: this was LAN-only. It is PUBLIC now, as
#      books.avrana.net through the cloudflared tunnel, docs/services/cloudflare-tunnel.md.)
#   3. Send-to-Kindle: Admin -> Basic Configuration -> E-mail server settings
#      (SMTP sender), then each user sets their @kindle.com address. The SMTP
#      "from" address must be on Amazon's Approved Personal Document senders
#      list or Amazon silently drops the mail.
#
# Auth / exposure: public through the tunnel, LDAP login, no reverse-proxy auth in front.
# ---------------------------------------------------------------------------
