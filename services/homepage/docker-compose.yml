services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: homepage-dockerproxy
    # The proxy serves a Unix socket in ./docker-proxy (mode 0700, owned by cody) and has no
    # network at all, so nothing on a bridge or the host loopback can reach it (bug hunt A9).
    # haproxy runs as uid 1000 with the docker group so it can create the socket there and
    # read /var/run/docker.sock.
    user: "1000:1000"
    group_add: ["110"]
    network_mode: none
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 0
      BIND_CONFIG: "/proxy/docker.sock mode 660"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-proxy:/proxy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /proxy/docker.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    depends_on:
      - dockerproxy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      HOMEPAGE_ALLOWED_HOSTS: 10.0.0.218:3000,avrana:3000,avrana.local:3000
    env_file:
      - ./widget-secrets.env
    volumes:
      - /home/cody/avrana/deploy/homepage/config:/app/config
      - ./docker-proxy:/proxy
    ports:
      - 10.0.0.218:3000:3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
