# ---------------------------------------------------------------------------
# Audiobookshelf -- the audiobook server (NOT Jellyfin; Jellyfin stays for
# video only and should not be pointed at /mnt/avrana_media/audiobooks).
#
# Serves the library that Libation writes (services/libation). Both containers
# bind-mount the same host path, /mnt/avrana_media/audiobooks. This was
# originally :ro on the rule that Libation is the sole writer; that was
# relaxed on 2026-08-13 so ABS can embed corrected metadata into the m4b
# files (see the volume comment below). Libation's direct "auto-upload to
# Audiobookshelf" feature is still deliberately unused.
#
# iOS playback is via AudioBooth, which talks to this server. PUBLIC: the
# cloudflared tunnel publishes this as listen.avrana.net (docs/services/cloudflare-tunnel.md),
# so an upstream advisory here is internet-reachable. Treat the pin below accordingly.
# ---------------------------------------------------------------------------

services:
  audiobookshelf:
    # 2.37.2, multi-arch index digest. GHSA-m5hp-x2xc-7jqq needs >= 2.37.0 (2.36.1 is still affected).
    # Upgrade and rollback: docs/runbooks/rc3-upstream-upgrades.md. Keep ABS_IMAGE in
    # services/backups/restore-test.py the same.
    image: ghcr.io/advplyr/audiobookshelf@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    container_name: audiobookshelf

    # This image has no PUID/PGID support and runs as root unless told
    # otherwise. Pin it to cody so ./config and ./metadata don't fill up with
    # root-owned files.
    user: "1000:1000"

    environment:
      - TZ=America/Los_Angeles

    volumes:
      # Server database, users, library definitions, API tokens.
      - ./config:/config
      # Cached covers, scanned metadata, backups.
      - ./metadata:/metadata
      # Read-WRITE, deliberately. ABS's "embed metadata" / quick-embed tool
      # runs ffmpeg with -c copy (no re-encode) and writes
      # "<book>.tmp.m4b" INTO THE BOOK'S OWN FOLDER, then copies it over the
      # original and deletes the temp -- so it needs write permission on the
      # directories, not just the files. That is the only reason this is not
      # :ro. Consequences of allowing it:
      #   - ABS may now also write metadata.json/covers into the library tree.
      #   - Libation remains the only thing that CREATES books here; it will
      #     not clobber ABS's tag edits, because Settings.json has
      #     OverwriteExisting=false, so an existing file is never rewritten.
      #   - An interrupted embed can leave a stray *.tmp.m4b behind. Harmless,
      #     but delete them: find /mnt/avrana_media/audiobooks -name '*.tmp.m4b'
      - /mnt/avrana_media/audiobooks:/audiobooks

    # The container listens on 80 internally (PORT=80 in the image), NOT on
    # 13378. 13378 is only the conventional host-side port.
    ports:
      - 10.0.0.218:13378:80

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

    logging:

      driver: json-file

      options:

        max-size: "50m"

        max-file: "5"

    restart: unless-stopped
