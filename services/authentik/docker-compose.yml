services:
  postgresql:
    image: docker.io/library/postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    container_name: authentik-postgresql
    env_file: [.env]
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    # ON THE SSD, NOT A DOCKER NAMED VOLUME -- load-bearing.
    # Docker's data root here is /mnt/avrana_media/docker, i.e. the 7.3 TB
    # SPINNING array, so a named volume put this database on a spindle shared
    # with all media I/O. Measured 2026-08-20: fsync 775 ms on the array (sdb)
    # vs 1.33 ms on the SSD (sda). ./pgdata is under /home/cody = SSD-backed
    # root fs. Migrated with ownership preserved (uid/gid 70). Do not revert.
    volumes: [./pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /run:rw,noexec,nosuid,nodev,size=32m
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    restart: unless-stopped

  server:
    image: ghcr.io/goauthentik/server@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: authentik-server
    command: server
    env_file: [.env]
    environment: &authentik_environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    depends_on:
      postgresql: {condition: service_healthy}
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    ports:
      - 127.0.0.1:9000:9000
      - 10.0.0.218:9000:9000
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    shm_size: 512mb
    logging: *logging
    restart: unless-stopped

  worker:
    image: ghcr.io/goauthentik/server@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: authentik-worker
    command: worker
    env_file: [.env]
    environment: *authentik_environment
    depends_on:
      postgresql: {condition: service_healthy}
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/avrana:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    shm_size: 512mb
    logging: *logging
    restart: unless-stopped

  # LDAP outpost serving the calibre-ldap provider on :3389. Reaches the core via the
  # frontend network (service "server"); reachable by Calibre-Web over the shared
  # avrana-ldap network so LDAP never touches the LAN. Token in .env (AUTHENTIK_LDAP_TOKEN).
  ldap:
    image: ghcr.io/goauthentik/ldap@sha256:68a595f5a7b75fb3615f1609725adaf1d45f743aafece715d943b9706074c307
    container_name: authentik-ldap
    environment:
      AUTHENTIK_HOST: http://server:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN:?ldap outpost token required}
    depends_on:
      server: {condition: service_healthy}
    networks: [frontend, avrana-ldap]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped

networks:
  frontend:
  backend: {internal: true}
  avrana-ldap: {external: true}
