version: 1
metadata:
  name: Avrana - Landing (branding + link-only video apps)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
# Purpose: make https://auth.avrana.net (Authentik's "My applications" library) a complete,
# branded, role-aware Avrana landing page. It already shows only the apps a user's groups
# permit — the gaps were (1) it said "authentik", not Avrana, and (2) Jellyfin and Seerr were
# absent because they don't use OIDC, so a video user saw an incomplete page. These are
# link-only applications (no provider): the tile + group gating live here; the actual auth is
# each app's own login (Jellyfin credential replication, Seerr-on-Jellyfin). Tile visibility
# is presentation only — real enforcement stays at the app/proxy layer.
entries:
  # Brand the user-facing pages as Avrana. Partial update matched by domain; the brand's flow
  # bindings and default flag are left untouched. The CSS intentionally applies to the flow
  # executor and user library, not the admin interface: operators still need the product's real
  # names there for troubleshooting. Prefer variables and exported parts over DOM internals so
  # this survives frontend upgrades.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: Avrana
      attributes:
        settings:
          theme:
            base: dark
      branding_custom_css: |
        /* AVRANA Brand v1.0.0 on Authentik (auth.avrana.net): flow pages and the user library.
           Source for Brand.branding_custom_css. build_brand_css.py fills the wordmark token below with the package's
           cream wordmark (base64, byte-exact, SHA-256 pinned in SOURCES.json) and writes avrana-brand-v1.css and the
           avrana-landing.yaml blueprint. Edit this file, never the generated ones.
           Authentik puts this text in a document style element after replacing the three HTML-special characters
           (less-than, greater-than, ampersand) with JSON escapes (authentik/brands/utils.py:63), and adopts it raw into
           every component's shadow root (web/src/elements/Base.ts:113). So none of those three characters appear here
           (no child combinators), and every selector works in both places. */

        :root,
        :host,
        html[data-theme="dark"],
        html[data-theme="light"] {
          color-scheme: dark;
          --avr-wordmark: url("data:image/svg+xml;base64,");
          --pf-global--FontFamily--sans-serif: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          --pf-global--FontFamily--heading--sans-serif: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          --pf-global--FontFamily--monospace: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          --ak-font-family-sans-serif: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          --ak-font-family-monospace: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          /* Spire Ink ground, Cream type, Stone secondary (8.2:1), Control interactive edges (3.6:1) */
          --pf-global--BackgroundColor--100: #121214;
          --pf-global--BackgroundColor--150: #121214;
          --pf-global--BackgroundColor--200: #121214;
          --pf-global--BackgroundColor--300: #1e1e21;
          --pf-global--BackgroundColor--400: #1e1e21;
          --pf-global--BackgroundColor--light-100: #121214;
          --pf-global--BackgroundColor--dark-100: #121214;
          --pf-global--Color--100: #edeae4;
          --pf-global--Color--200: #aeaba7;
          --pf-global--Color--light-100: #edeae4;
          --pf-global--Color--light-200: #aeaba7;
          --pf-global--BorderColor--100: #6e6c72;
          --pf-global--BorderColor--200: #6e6c72;
          --pf-global--BorderColor--300: #6e6c72;
          --pf-global--BorderColor--400: #8f8c89;
          --pf-global--primary-color--100: #edeae4;
          --pf-global--primary-color--200: #aeaba7;
          --pf-global--active-color--100: #edeae4;
          --pf-global--link--Color: #edeae4;
          --pf-global--link--Color--hover: #edeae4;
          --pf-global--link--Color--visited: #edeae4;
          --pf-global--danger-color--100: #ff8b8b;
          --pf-global--danger-color--200: #ff8b8b;
          --pf-global--BoxShadow--md: none;
          --ak-accent: #edeae4;
          --ak-dark-foreground: #edeae4;
          --ak-dark-background: #121214;
          --ak-dark-background-light: #161618;
          --ak-dark-background-lighter: #1e1e21;
          --ak-flow-background: #121214;
          --ak-global--Color--100: #edeae4;
          --ak-global--Color--200: #aeaba7;
          --ak-global--BackgroundColor--100: #121214;
          --ak-global--BackgroundColor--200: #121214;
          --ak-global--BackgroundContrastFilter: none;
        }

        /* The login card's own variables are set on the executor element (static.global.css), so set them there too. */
        .pf-c-login,
        :host(.pf-c-login) {
          --ak-c-login__main--BackgroundColor: #121214 !important;
          --ak-c-login__main--Color: #edeae4 !important;
          --ak-c-login__main--BoxShadow: none !important;
          --ak-c-login--BackgroundColorOverlay: #121214 !important;
          --ak-c-login__footer--Color: #aeaba7 !important;
        }

        html,
        body,
        button,
        input,
        select,
        textarea {
          font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        }

        /* Monospace only for strings people copy: recovery codes, secrets, tokens. */
        code,
        pre,
        kbd,
        samp {
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace !important;
        }

        html,
        body,
        .pf-c-page,
        .pf-c-background-image,
        .ak-login-container {
          background: #121214 !important;
          color: #edeae4 !important;
        }

        .pf-c-background-image {
          --ak-flow-background: #121214 !important;
          background-image: none !important;
        }

        .pf-c-login__main,
        .pf-c-card,
        .pf-c-modal-box {
          background: #121214 !important;
          color: #edeae4 !important;
          border: 1px solid #5e5b57 !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }

        /* Fields: transparent, Control edge, square; native controls drawn dark. */
        .pf-c-form-control,
        input:not([type="checkbox"]):not([type="radio"]),
        select,
        textarea {
          background-color: transparent !important;
          color: #edeae4 !important;
          border: 1px solid #6e6c72 !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          max-width: 100%;
        }

        .pf-c-form-control:focus,
        input:not([type="checkbox"]):not([type="radio"]):focus,
        select:focus,
        textarea:focus {
          border-color: #edeae4 !important;
        }

        input::placeholder,
        textarea::placeholder {
          color: #aeaba7 !important;
          opacity: 1;
        }

        input[type="checkbox"],
        input[type="radio"] {
          accent-color: #edeae4;
          width: 1.25rem;
          height: 1.25rem;
        }

        .pf-c-form__label,
        .pf-c-form__label-text {
          color: #edeae4 !important;
        }

        .pf-c-form__helper-text {
          color: #aeaba7 !important;
        }

        .pf-c-form__helper-text.pf-m-error {
          color: #ff8b8b !important;
        }

        /* Buttons: square, 44px; primary is Cream on Spire Ink and inverts on hover. */
        .pf-c-button {
          border-radius: 0 !important;
          box-shadow: none !important;
          min-height: 2.75rem;
        }

        .pf-c-button::after {
          border-radius: 0 !important;
        }

        .pf-c-button.pf-m-primary {
          color: #121214 !important;
          background: #edeae4 !important;
          border: 1px solid #edeae4 !important;
        }

        .pf-c-button.pf-m-primary:hover {
          color: #edeae4 !important;
          background: #121214 !important;
        }

        .pf-c-button.pf-m-secondary,
        .pf-c-button.pf-m-tertiary,
        .pf-c-button.pf-m-control {
          color: #edeae4 !important;
          background: transparent !important;
          border: 1px solid #6e6c72 !important;
        }

        .pf-c-button.pf-m-secondary:hover,
        .pf-c-button.pf-m-tertiary:hover,
        .pf-c-button.pf-m-control:hover {
          color: #121214 !important;
          background: #edeae4 !important;
          border-color: #edeae4 !important;
        }

        a,
        .pf-c-button.pf-m-link {
          color: #edeae4 !important;
          text-decoration-line: underline;
          text-decoration-color: #8f8c89 !important;
          text-decoration-thickness: 1px;
          text-underline-offset: 0.2em;
        }

        a:hover,
        .pf-c-button.pf-m-link:hover {
          text-decoration-color: #edeae4 !important;
        }

        /* One focus ring everywhere (DESIGN.md, the Focus Ring Rule); the outline keeps one in forced colours.
           The field selectors repeat the field rule's :not() chain so this rule outranks its box-shadow: none. */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        input:not([type="checkbox"]):not([type="radio"]):focus-visible,
        .pf-c-form-control:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        summary:focus-visible,
        [tabindex]:focus-visible,
        .pf-c-button:focus-visible {
          outline: 2px solid transparent !important;
          outline-offset: 0 !important;
          box-shadow: 0 0 0 2px #121214, 0 0 0 4px #edeae4 !important;
        }

        /* The mark. branding_logo cannot carry the package file (a media path or an http(s) URL only:
           authentik/admin/files/validation.py:48, backends/passthrough.py:8), so the stock image is hidden and the
           package wordmark is drawn from the data URI above. Never retyped, never redrawn. Decorative: the flow title
           ("Welcome to Avrana!") names the page. Width 12.5rem (200px; package minimum 120px), clear space above
           and below at least 16% of its height. No rule beneath it (owner, 2026-10-18). */
        .pf-c-login__main-header.pf-c-brand .branding-logo,
        .pf-c-brand img,
        .ak-brand img {
          display: none !important;
        }

        .pf-c-login__main-header.pf-c-brand {
          flex-direction: column;
          align-items: center;
        }

        .pf-c-login__main-header.pf-c-brand::before {
          content: "";
          display: block;
          width: min(12.5rem, 100%);
          aspect-ratio: 1701.6 / 650;
          margin-block: 0.75rem;
          background: var(--avr-wordmark) center / contain no-repeat;
        }

        /* User library header: the image stays in the accessibility tree (its alt is the link's name, "Avrana")
           but is hidden visually, and the wordmark is drawn at the package's 120px minimum width. */
        img.pf-c-brand {
          position: absolute !important;
          width: 1px !important;
          height: 1px !important;
          margin: -1px !important;
          overflow: hidden !important;
          clip-path: inset(50%) !important;
        }

        .pf-c-page__header-brand-link {
          display: inline-flex;
          align-items: center;
          min-height: 2.75rem;
        }

        .pf-c-page__header-brand-link::before {
          content: "";
          display: block;
          width: 7.5rem;
          aspect-ratio: 1701.6 / 650;
          background: var(--avr-wordmark) center / contain no-repeat;
        }

        /* Forced colours: keep the package artwork exactly, on its own Spire Ink patch, so it stays visible on a
           light high-contrast ground without being retyped. */
        @media (forced-colors: active) {
          .pf-c-login__main-header.pf-c-brand::before,
          .pf-c-page__header-brand-link::before {
            forced-color-adjust: none;
            background-color: #121214;
            outline: 0.5rem solid #121214;
          }
        }

        ak-flow-executor::part(locale-select),
        .pf-c-login__footer {
          display: none !important;
        }

  # --- Jellyfin (movies & TV) — gated by avrana-videos --------------------------------------
  - model: authentik_core.application
    id: jellyfin-app
    identifiers:
      slug: jellyfin
    attrs:
      name: TV and Movies
      group: Watch
      meta_launch_url: https://watch.avrana.net
      meta_description: Movies & TV
      open_in_new_tab: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf jellyfin-app
      group: !Find [authentik_core.group, [name, avrana-videos]]
      order: 0
    attrs:
      enabled: true

  # --- Seerr (requests) — gated by avrana-requests ------------------------------------------
  # NOTE: Seerr login rides on a Jellyfin account, so an invite granting avrana-requests should
  # also grant avrana-videos (the enrollment default set already grants both together).
  - model: authentik_core.application
    id: seerr-app
    identifiers:
      slug: seerr
    attrs:
      name: Requests
      group: Watch
      meta_launch_url: https://request.avrana.net
      meta_description: Request new movies & shows
      open_in_new_tab: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf seerr-app
      group: !Find [authentik_core.group, [name, avrana-requests]]
      order: 0
    attrs:
      enabled: true
