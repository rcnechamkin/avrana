version: 1
metadata:
  name: Avrana - Kindle connector (kindle.avrana.net proxy)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
# Set your Send-to-Kindle address once and have it written into both Calibre-Web and
# Audiobookshelf. Same topology as the portal: proxy provider on the embedded outpost, which
# authenticates and injects X-authentik-* headers.
#
# Gated by avrana-books - the group that actually has ebooks. The app ALSO checks the group
# itself from the header, so the gate is not a single point of failure.
#
# The provider must be added to the embedded outpost imperatively after apply (the blueprint
# importer chokes on the outpost providers m2m - same as the portal and OliveTin).
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: kindle-provider
    identifiers:
      name: avrana-kindle-proxy
    attrs:
      mode: proxy
      external_host: https://kindle.avrana.net
      internal_host: http://avrana-kindle-connector:8096
      internal_host_ssl_validation: false
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=24

  - model: authentik_core.application
    id: kindle-app
    identifiers:
      slug: avrana-kindle
    attrs:
      name: Kindle
      provider: !KeyOf kindle-provider
      meta_launch_url: https://kindle.avrana.net
      meta_description: Send-to-Kindle setup
      group: Read

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kindle-app
      group: !Find [authentik_core.group, [name, avrana-books]]
      order: 0
    attrs:
      enabled: true
