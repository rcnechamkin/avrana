version: 1
metadata:
  name: Avrana - Audiobookshelf OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.user
    identifiers:
      username: akadmin
    attrs:
      attributes:
        email_verified: true
  - model: authentik_providers_oauth2.scopemapping
    id: audiobookshelf-email-scope
    identifiers:
      name: Avrana Audiobookshelf verified email
    attrs:
      scope_name: email
      description: Verified email for explicitly verified Authentik users
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified", False),
        }
  # ABS appends the value of authOpenIDGroupClaim to the requested scopes, so this
  # mapping's scope_name MUST equal that setting ("groups"). ABS then lowercases the
  # claim list and picks the first of admin/user/guest it finds (OidcAuthStrategy.js).
  # Its root user cannot be downgraded -- if this ever returns non-admin for the root
  # account's email, ABS denies that login outright.
  - model: authentik_providers_oauth2.scopemapping
    id: audiobookshelf-groups-scope
    identifiers:
      name: Avrana Audiobookshelf role
    attrs:
      scope_name: groups
      description: Maps Avrana groups onto the admin/user/guest roles ABS understands
      expression: |
        groups = [group.name for group in request.user.all_groups()]
        if request.user.is_superuser:
            role = "admin"
        elif "avrana-audiobooks" in groups:
            role = "user"
        else:
            role = "guest"
        return {"groups": [role]}
  - model: authentik_providers_oauth2.oauth2provider
    id: audiobookshelf-provider
    identifiers:
      name: audiobookshelf
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: f9aea1396b6671acbdf9fb3d1723524e6acb7328
      client_secret: !Env AVRANA_OIDC_AUDIOBOOKSHELF_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://listen.avrana.net/auth/openid/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://listen.avrana.net/auth/openid/mobile-redirect
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://listen.avrana.net/
          redirect_uri_type: logout
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf audiobookshelf-email-scope
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf audiobookshelf-groups-scope
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  # Identified by pk, not slug: the slug IS the OIDC issuer path, and ABS stores that
  # path in absdatabase.sqlite. Renaming this app in the web UI rewrites the slug and
  # silently 404s ABS's issuer/JWKS URLs (this happened 2026-08-13). Pinning by pk lets
  # the display name change freely while the slug stays put.
  - model: authentik_core.application
    id: audiobookshelf-app
    identifiers:
      pk: 90a119976fd3475d9afede46a86c543d
    attrs:
      slug: audiobookshelf
      name: Audiobooks
      group: Listen
      provider: !KeyOf audiobookshelf-provider
      meta_launch_url: https://listen.avrana.net
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf audiobookshelf-app
      group: !Find [authentik_core.group, [name, avrana-audiobooks]]
      order: 0
    attrs:
      enabled: true
