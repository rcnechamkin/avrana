version: 1
metadata:
  name: Avrana - OliveTin ops console (ops.avrana.net proxy)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
# Admin-only operations console at ops.avrana.net. A proxy provider on the embedded outpost
# authenticates the user, then reverse-proxies to the olivetin container with X-authentik-*
# headers injected -- OliveTin reads X-authentik-username / X-authentik-groups and applies its own
# default-deny ACL on top, so this is defence in depth, not a single gate.
#
# Gated by "authentik Admins", the existing dedicated administrator group. Deliberately NOT
# avrana-users: ordinary members must not even be able to load this app.
#
# Adding the provider to the embedded outpost is done imperatively after apply (the blueprint
# importer chokes on the outpost providers m2m -- same as the portal and the LDAP outpost).
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: olivetin-provider
    identifiers:
      name: avrana-olivetin-proxy
    attrs:
      mode: proxy
      external_host: https://ops.avrana.net
      internal_host: http://olivetin:1337
      internal_host_ssl_validation: false
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Shorter than the portal's 24h: an admin console should not hold a long-lived session.
      access_token_validity: hours=8

  - model: authentik_core.application
    id: olivetin-app
    identifiers:
      slug: avrana-olivetin
    attrs:
      name: Operations
      provider: !KeyOf olivetin-provider
      meta_launch_url: https://ops.avrana.net
      meta_description: Admin operations console
      # Category heading on the app library / landing page.
      group: Administration

  # Admins only. This is the outer gate; OliveTin's own ACL is the inner one.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf olivetin-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
