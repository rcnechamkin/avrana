# Avrana Home LIVE-DATA BETA (AVR-771): real Authentik sign-in, the allowed tester's REAL libraries, read-only.
# Runbook: docs/runbooks/home-beta-live.md. Owner-applied; nothing deploys this automatically.
#
# Same topology and Authentik provider as the synthetic beta (docker-compose.beta.yml): cloudflared
# (media-beta.avrana.net) -> Authentik embedded outpost (signs in, gated by the avrana-beta group) -> HERE, with
# the signed X-authentik-jwt. Same container name, so the provider's internal host http://avrana-home-beta:8096
# is unchanged; run this file OR docker-compose.beta.yml, never both.
#
# The app runs as serve.py runs it (Dockerfile.live): real mode, which settings.py allows only with
# HOME_GATES_VERIFIED=yes (G1 applied and signed off 2026-10-27, docs/DECISIONS.md; G2 suites in CI),
# HOME_IDENTITY_MODE=jwt_required (also required by the Audiobookshelf admin token) and HOME_ALLOWED_USERS
# (the second lock behind the avrana-beta group). A member is matched to their Jellyfin and Audiobookshelf
# account by EXACT username (no mapping table); a name that differs shows "not set up".
#
# Comics (Komga) and ebooks (Calibre-Web) were added 2026-10-27 (owner: "flip the switch"). Both are SHARED views
# (ADAPTER-CONTRACT 12.2, 13.2): one regular, non-admin Komga account's API key and one Calibre-Web viewer account,
# the same secret files the owner preview uses. They are allowed only because the owner confirmed on 2026-10-15
# that no member is restricted in either (docs/DECISIONS.md); a member still needs the avrana-comics or
# avrana-books group to see them.
#
# Networks: `authentik_home_beta` (shared with authentik-server alone, the G1 pattern) and the existing
# Docker networks of the libraries it reads, so every upstream is a Docker service name or the host gateway:
# HTTPS across machines (settings.plain_http_allowed); a LAN address over http is refused. All external:
# this file creates no network. No host port is published.
#
# Secrets: ./secrets/ (gitignored, mode 0600, typed by the owner at a hidden prompt). Non-secret settings:
# ./beta-live.env (gitignored; copy beta-live.env.example).
services:
  avrana-home-beta:
    build:
      context: .
      dockerfile: Dockerfile.live
      additional_contexts:
        portal: ../avrana-portal
    image: avrana-home-live:local
    container_name: avrana-home-beta
    networks: [authentik_home_beta, audiobookshelf_default, komga_default, calibre-web-automated_default]
    # MEMBER REQUESTS (docs/runbooks/media-requests-rollout.md step 4): use this line instead to reach Shelfarr,
    # Omnibus and Seerr by service name. All three networks exist already; joining creates none.
    # networks: [authentik_home_beta, audiobookshelf_default, komga_default, calibre-web-automated_default, shelfarr_default, omnibus, docker_request-backend]
    # Jellyfin runs on the host network (:8096): reached as host.docker.internal, never the LAN address.
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [beta-live.env]
    environment:
      - HOME_UPSTREAM_MODE=real
      - HOME_GATES_VERIFIED=yes
      - HOME_IDENTITY_MODE=jwt_required
      # RC1 S1: each username is accepted only as the Authentik user that holds it (identity_bindings.py), so a
      # recreated or renamed account never inherits a former member's libraries, requests or profile. Lives in ./state
      # (the `volumes:` line below must be on). INITIALISE IT FROM AUTHENTIK BEFORE THIS DEPLOY: without the file
      # every member is refused (docs/runbooks/identity-bindings.md section 1).
      - HOME_IDENTITY_BINDINGS_FILE=/var/lib/avrana-home/identity_bindings.json
      - HOME_JWT_SECRET_FILE=/run/secrets/home_jwt_secret
      - HOME_HEALTH_DETAIL=off
      - HOME_SECTIONS=on
      - JELLYFIN_BASE_URL=http://host.docker.internal:8096
      - JELLYFIN_API_KEY_FILE=/run/secrets/jellyfin_api_key
      - AUDIOBOOKSHELF_BASE_URL=http://audiobookshelf:80
      - AUDIOBOOKSHELF_TOKEN_FILE=/run/secrets/audiobookshelf_token
      - KOMGA_BASE_URL=http://komga:25600
      - KOMGA_TOKEN_FILE=/run/secrets/komga_token
      # Members' own Komga keys, for their Continue reading row (docs/runbooks/komga-member-keys.md). Home writes
      # the file itself (S-01 intake and Me -> Comics below; LEGACY: HOME_PROVISION_ACCOUNTS=...,komga with
      # HOME_KOMGA_LEGACY_PROVISION=on and the admin key, both retired), so it lives in ./state (owned by
      # uid 1000, mode 0700), the ONLY writable mount, and Home reloads it when it changes. Off until the owner sets
      # up ./state and secrets/komga_admin_token; then uncomment these two lines, the `volumes:` line, the
      # komga_admin_token entry at the bottom, and use the second `secrets:` line below.
      # - KOMGA_MEMBER_KEYS_FILE=/var/lib/avrana-home/komga_member_keys
      # - KOMGA_ADMIN_TOKEN_FILE=/run/secrets/komga_admin_token
      # S-01 (docs/runbooks/komga-key-lifecycle.md): keys are minted where the password lives. The enrollment stage
      # PUTs a new member's key to Home's intake (the token, and the authentik_home_beta subnet from
      # `docker network inspect authentik_home_beta`); members connect or disconnect themselves on Me -> Comics.
      # Both need KOMGA_MEMBER_KEYS_FILE above; neither needs komga_admin_token. Add home_key_intake_token to the
      # `secrets:` line in use.
      # - HOME_KEY_INTAKE_TOKEN_FILE=/run/secrets/home_key_intake_token
      # - HOME_INTERNAL_CIDR=<authentik_home_beta subnet, e.g. 172.18.0.0/16>
      # - HOME_KOMGA_CONNECT=on
      # Me -> My profile (members' own photo and display name; memberstore.py). One SQLite file in the same ./state
      # mount. Off until the owner sets up ./state; then uncomment this line and the `volumes:` line. Back up
      # ./state/members.sqlite3 with ./state; offboarding a member purges their row (docs/runbooks/offboarding.md).
      # - HOME_MEMBER_STORE=/var/lib/avrana-home/members.sqlite3
      - KOMGA_OWNER_CONFIRMS_NO_MEMBER_RESTRICTIONS=yes
      - CALIBRE_WEB_BASE_URL=http://calibre-web-automated:8083
      - CALIBRE_WEB_CREDENTIAL_FILE=/run/secrets/calibre_web_credential
      - CALIBRE_WEB_OWNER_CONFIRMS_NO_MEMBER_RESTRICTIONS=yes
      - TZ=America/Los_Angeles
      # MEMBER REQUESTS (rollout step 4). A switch and its URL go together: a URL whose switch is off refuses to
      # start. The keys are the forks' scoped on-behalf keys (rollout step 3), never an app's main admin key.
      # - HOME_BOOK_REQUESTS=on
      # - SHELFARR_BASE_URL=http://shelfarr:80
      # - SHELFARR_TOKEN_FILE=/run/secrets/shelfarr_token
      # - HOME_WATCH_REQUESTS=on
      # - SEERR_BASE_URL=http://seerr:5055
      # - SEERR_API_KEY_FILE=/run/secrets/seerr_api_key
      # - HOME_COMIC_REQUESTS=on
      # - OMNIBUS_BASE_URL=http://omnibus:3000
      # - OMNIBUS_API_KEY_FILE=/run/secrets/omnibus_api_key
      # Optional (rollout steps 6 and 7):
      # - HOME_SHELFARR_PROVISION=on
      # - HOME_SEERR_PROVISION=on
      # - HOME_LIBRARY_IDS_FILE=/var/lib/avrana-home-index/library_ids.json
    secrets: [home_jwt_secret, jellyfin_api_key, audiobookshelf_token, komga_token, calibre_web_credential]
    # secrets: [home_jwt_secret, jellyfin_api_key, audiobookshelf_token, komga_token, calibre_web_credential, komga_admin_token]
    # MEMBER REQUESTS: add shelfarr_token, seerr_api_key and omnibus_api_key to whichever secrets: line is in use.
    # ./state is the ONLY writable mount (identity bindings; Komga member keys and the member store when switched on).
    # It stays active whenever HOME_IDENTITY_BINDINGS_FILE is: without it Home refuses every member (S-11). It is
    # backed up inside stack-config (services/backups/avrana-backup.sh, S-04).
    volumes: ["./state:/var/lib/avrana-home:rw"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8096/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped

networks:
  # Created by the owner once (home-beta-deploy.md step 2), shared with authentik-server only.
  authentik_home_beta:
    external: true
  # Audiobookshelf's own compose network (service name `audiobookshelf`, container port 80; checked 2026-10-27).
  audiobookshelf_default:
    external: true
  # Komga's and Calibre-Web Automated's own compose networks (container names `komga` port 25600 and
  # `calibre-web-automated` port 8083; checked read-only on avrana 2026-10-27).
  komga_default:
    external: true
  calibre-web-automated_default:
    external: true
  # MEMBER REQUESTS: Shelfarr's and Omnibus's own networks and the media stack's request network (Seerr; Radarr and
  # Sonarr are on it too, but Home holds no key for them). Names as `docker inspect` printed them on 2026-10-29: the
  # media stack's compose project is `docker`, hence `docker_request-backend`.
  # shelfarr_default:
  #   external: true
  # omnibus:
  #   external: true
  # docker_request-backend:
  #   external: true

secrets:
  home_jwt_secret:
    file: ./secrets/home_jwt_secret
  jellyfin_api_key:
    file: ./secrets/jellyfin_api_key
  audiobookshelf_token:
    file: ./secrets/audiobookshelf_token
  komga_token:
    file: ./secrets/komga_token
  # komga_admin_token:          # LEGACY (S-01): only with HOME_KOMGA_LEGACY_PROVISION=on; to be deleted
  #   file: ./secrets/komga_admin_token
  # home_key_intake_token:      # S-01: the shared secret the enrollment stage sends to Home's key intake
  #   file: ./secrets/home_key_intake_token
  calibre_web_credential:
    file: ./secrets/calibre_web_credential
  # MEMBER REQUESTS (rollout step 3):
  # shelfarr_token:
  #   file: ./secrets/shelfarr_token
  # seerr_api_key:
  #   file: ./secrets/seerr_api_key
  # omnibus_api_key:
  #   file: ./secrets/omnibus_api_key
