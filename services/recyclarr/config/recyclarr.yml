# Recyclarr -> Radarr, following the TRaSH guides.
#
# Two profiles, deliberately:
#   "UHD Bluray + WEB"              the normal high-quality profile for the library
#   "Remux + WEB 2160p"             the opt-in Reference profile, for favourites and IMAX
#                                   titles where the extra bitrate is actually wanted
#
# Both are generated from the TRaSH guide templates, which are identical apart from the
# quality-profile id, so they share one instance and one set of custom formats. Recyclarr
# creates these two profiles by name and does not touch Radarr's seven stock profiles.
#
# NOTHING IS ASSIGNED TO THESE PROFILES BY THIS FILE. Movies keep whatever profile they
# already have, so syncing cannot start an upgrade. Moving a movie onto one of these
# profiles is a separate, deliberate act.
radarr:
  avrana:
    base_url: http://10.0.0.218:7878
    api_key: !env_var RADARR_API_KEY

    # TRaSH size limits per quality. Radarr shipped defaults here (many capped at 100 MB/min,
    # the 2160p tiers uncapped entirely), which is what lets a 4 GB "2160p" and a 90 GB remux
    # both look acceptable.
    quality_definition:
      type: movie

    # Radarr had renaming switched OFF, so filenames carry no quality/HDR/group information.
    # jellyfin-tmdb because Jellyfin is the media server here and Radarr is TMDB-native.
    # NOTE: this governs future imports. Existing files are only renamed when a Rename
    # operation is triggered by hand, which this deployment does not do.
    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: fd161a61e3ab826d3a22d53f935696dd  # Remux + WEB 2160p
        reset_unmatched_scores:
          enabled: true

    # ---------------------------------------------------------------------------------------
    # COMPATIBILITY-FIRST DEFAULT (added 2026-08-18)
    #
    # Renamed 2026-08-18: "Avrana Compatible - 4K SDR" -> "Avrana Compatible". The old name
    # undersold it once HDR10 became acceptable. Renamed IN THE APPS FIRST (PUT on the existing
    # profile id, so Radarr 10 / Sonarr 9 and the Seerr mapping survive), THEN here -- changing
    # only this file would have made recyclarr create a second profile and orphan the original.
    #
    # Policy (REVISED 2026-08-18): maximize 4K picture quality for modern clients while avoiding
    # the HDR formats most likely to force server-side transcoding.
    #   1. 2160p HEVC, SDR **or plain HDR10** -- HDR10 is a peer of SDR, not a penalty
    #   2. 1080p H.264 SDR as the compatibility fallback
    #   3. Dolby Vision / HDR10+ / HLG strongly penalized (still reachable as a last resort)
    # The premium profiles above are untouched and remain the opt-in path for DV, HDR10+, IMAX
    # and remux.
    #
    # ALL allowed qualities sit in ONE quality group on purpose. Radarr sorts by quality tier
    # FIRST and custom-format score only second, so with separate tiers a 2160p HDR release
    # would always beat a 1080p SDR one no matter how negative its score. Collapsing them into
    # a single group is what lets scoring decide, which is the whole point of this profile.
    # (Same mechanism already documented for the IMAX case.)
    #
    # Remux tiers are excluded entirely: "avoid unnecessarily huge releases", and the household's
    # main client refuses anything over 40 Mbps.
      - name: Avrana Compatible
        score_set: default
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Compatible 4K/1080p
          until_score: 10000
        # HDR AS LAST RESORT (2026-08-18). Chosen against the measured score landscape:
        # Measured bands after the 2026-08-18 revision:
        #   2160p SDR x265 tier1   +2650   preferred
        #   2160p SDR BluRay tier1 +2600   (TrueHD; audio is only a 150pt tiebreaker)
        #   2160p HDR10 x265 tier1 +2150   ACCEPTED as a peer, no longer penalized
        #   1080p SDR x264 tier1   +1850   fallback
        #   2160p HDR10 no tier     +450   accepted, weak source
        #   2160p DV / HDR10+      -2850   last resort only
        #   2160p DV+HDR10+        -7850   BLOCKED
        #   2160p HLG              -7850   BLOCKED
        #   1080p x265             -7850   BLOCKED (forces transcoding on this hardware)
        #   2160p DV-only         -14550   BLOCKED (worst case, wrong colours everywhere)
        # SDR outscores HDR by ~10000, so whenever both exist SDR wins outright; the threshold
        # only decides whether an HDR-only title gets nothing or gets HDR.
        min_format_score: -6000
        quality_sort: top
        qualities:
          - name: Compatible 4K/1080p
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p

    custom_format_groups:
      add:
        # Release-group tiers, HDR, and audio formats are REQUIRED members of the two profiles
        # above and are synced automatically; they are not listed here.

        # Keeps a good 1080p encode from losing to a bad 2160p one purely on resolution.
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD

        # Unwanted / low-quality: BR-DISK, LQ, LQ (Release Title), Upscaled, 3D, AV1,
        # Bad Dual Groups, Extras, Line/Mic Dubbed, Sing-Along, Generated Dynamic HDR,
        # Black and White Editions. All are group defaults, so none are excluded here.
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats

        # HDR compatibility safeguard. Dolby Vision without an HDR10 fallback renders
        # washed-out or green/purple on anything that cannot decode DV, and this host's
        # Jellyfin (Skylake / Gen9 QuickSync) cannot usefully transcode 4K HDR to rescue it.
        # This group scores those releases heavily negative so they lose to a safe HDR10 copy.
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76  # [HDR Formats] DV (w/o HDR fallback)

        # Prefer HDR10+ when an otherwise equal release offers it.
        - trash_id: b29413a7487478fe98228ce79e5689e4  # [HDR Formats] HDR10+ Boost

        # IMAX preference. IMAX Enhanced also carries the DTS:X / IMAX audio mix.
        - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
          select:
            - eecf3a857724171f968a66cb5719e152  # IMAX
            - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced

    custom_formats:
      # Repack/Proper handling (guide default scores).
      - trash_ids:
          - e7718d7a3ce595f289bfee26adc178f5
          - ae43b294509409a6a13919dedd4764c4
          - 5caaaa1c08c1742aa4342d8c4cc463f2
        assign_scores_to:
          - name: Avrana Compatible

      # Release-group tiers. Remux tiers are omitted: remux is excluded from this profile.
      - trash_ids:
          - 4d74ac4c4db0b64bff6ce0cffef99bf0
          - a58f517a70193f8e578056642178419d
          - e71939fae578037e7aed3ee219bbe7c1
          - ed27ebfef2f323e964fb1f61391bcb35
          - c20c8647f2746a1f4c4262b0fbbeeeae
          - 5608c71bcebba0a5e666223bae8c9227
          - c20f169ef63c5f40c2def54abaf4438e
          - 403816d65392c79236dcb6dd591aeda4
          - af94e0fe497124d1f9ce732069ec8c3b
        assign_scores_to:
          - name: Avrana Compatible

      # Streaming-service source formats (guide default scores).
      - trash_ids:
          - b3b3a6ac74ecbd56bcdbefa4799fb9df
          - df13ed57843877b21ad969184ab6888f
          - 40e9380490e748672c2522eaaeb692f7
          - cc5e51a9e85a6296ceefe097a77f12f4
          - 16622a6911d1ab5d5b8b713d5b0036d4
          - 84272245b2988854bfb76a16e60baea5
          - 509e5f41146e278f9eab1ddaceb34515
          - 5763d1b0ce84aff3b21038eea8e9b8ad
          - 526d445d4c16214309f0fd2b3be18a89
          - e0ec9672be6cac914ffad34a6b077209
          - 2a6039655313bf5dab1e43523b62c374
          - 6a061313d22e51e0f25b7cd4dc065233
          - 170b1d363bd8516fbf3a3eb05d4faff6
          - c9fd353f8f5f1baf56dc601c4cb29920
          - e36a0ba1bc902b26ee40818a1d59b8bd
          - 350e9170619683a55cb9191d0b1ababa
          - 44c2b54d7c81c1a442a8b2cabeaef54f
          - c2863d2a50c9acad1fb50e53ece60817
        assign_scores_to:
          - name: Avrana Compatible

      # TRaSH unwanted / low-quality filters (guide default scores).
      - trash_ids:
          - b8cd450cbfa689c0259a01d9e29ba3d6
          - cae4ca30163749b891686f95532519bd
          - b6832f586342ef70d9c128d40c07b872
          - cc444569854e9de0b084ab2b8b1532b2
          - ed38b889b31be83fda192888e2286d83
          - 0a3f082873eb454bde444150b70253cc
          - e6886871085226c3da1830830146846c
          - c465ccc73923871b3eb1802042331306
          - 90a6f9a284dff5103f6346090e6280c8
          - e204b80c87be9497a8a6eaff48f72905
          - 712d74cd88bceb883ee32f773656b1f5
          - bfd8eb01832d646a0a89c4deb46f8564
        assign_scores_to:
          - name: Avrana Compatible

      # POLICY: prefer 2160p SDR. TRaSH's SDR format matches 2160p releases that carry
      # no HDR marker, which is exactly the compatibility target.
      - trash_ids:
          - 9c38ebb7384dada637be8899efa68e6f
        assign_scores_to:
          - name: Avrana Compatible
            score: 500

      # POLICY: penalize EVERY HDR variant. TRaSH's HDR format matches DV-with-fallback,
      # HDR, HDR10, HDR10+, HLG and PQ in one format, so this is a single lever.
      # With min_format_score 0 this is an EXCLUSION, not just a preference.
      # POLICY (revised 2026-08-18): HDR10 is NOT penalized.
      # The Roku's own capability list accepts HDR10, so plain HDR10 direct-plays and is a peer of
      # SDR at 2160p. The broad TRaSH "HDR" format is therefore held at 0: it matches HDR10 as well
      # as DV/HDR10+/HLG, so using it as one lever would penalize the format we now want.
      # The problem ranges are penalized individually below instead.
      - trash_ids:
          - 493b6d1dbec3c3364c59d7607f7e3405
        assign_scores_to:
          - name: Avrana Compatible
            score: 0

      # POLICY: Dolby Vision. Penalized as a class, not blocked; premium profiles are the DV path.
      - trash_ids:
          - b337d6812e06c200ec9a2d3cfa9d20a7
        assign_scores_to:
          - name: Avrana Compatible
            score: -5000

      # POLICY: HDR10+. The specific range this household's main client refuses.
      - trash_ids:
          - caa37d0df9c348912df1fb1d88f9273a
        assign_scores_to:
          - name: Avrana Compatible
            score: -5000

      # POLICY: HLG. Guide default is already -10000, and the format explicitly excludes releases
      # that are HDR10 or HDR10+, so this cannot catch the ranges we want to keep.
      - trash_ids:
          - 9364dd386c9b4a1100dde8264690add7
        assign_scores_to:
          - name: Avrana Compatible

      # Broadly-supported audio, scored as a TIEBREAKER ONLY (deliberately NOT the guide
      # defaults of AAC 1000 / DD 750 / DD+ 1750).
      #
      # Why the deviation: TRaSH calibrates those numbers for a profile that ALSO scores
      # TrueHD/DTS-HD highly, so the spread is relative. Including only the compatible subset at
      # guide defaults leaves TrueHD at 0 and DD+ at 1750, i.e. an implicit ~1750 penalty on
      # lossless audio that TRaSH never intended. Measured effect: a 2160p SDR TrueHD release
      # scored 800 and LOST to a 1080p DD+ release at 3450 -- sacrificing a substantially better
      # release purely on audio, which the standard explicitly forbids.
      #
      # At 100/100/150 the preference survives as a tiebreaker between otherwise comparable
      # releases and can never outweigh a resolution tier (~1700).
      - trash_ids:
          - 240770601cc226190c367ef59aba7463          # AAC
        assign_scores_to:
          - name: Avrana Compatible
            score: 100
      - trash_ids:
          - c2998bd0d90ed5621d8df281e839436e          # DD / AC3
        assign_scores_to:
          - name: Avrana Compatible
            score: 100
      - trash_ids:
          - 185f1dd7264c4562b9022d963ac37424          # DD+ / EAC3
        assign_scores_to:
          - name: Avrana Compatible
            score: 150

      # POLICY: DV with no HDR10 fallback is the worst case (wrong colours everywhere that
      # cannot decode DV). Penalized beyond the generic HDR score.
      - trash_ids:
          - 923b6abef9b17f937fab56cfcf89e1f1
        assign_scores_to:
          - name: Avrana Compatible
            score: -10000

      # POLICY: 1080p HEVC forces transcoding on this hardware, so the 1080p fallback
      # prefers x264.
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc
        assign_scores_to:
          - name: Avrana Compatible
            score: -10000

      # IMAX EXPANDED FRAMING (2026-08-18). An INDEPENDENT preference layered on top of the
      # compatibility rules, not a replacement for them.
      #
      # +500 is deliberately small: it decisively beats an otherwise-equivalent non-IMAX release
      # (and out-weighs the 100-150 audio tiebreaker), but it is far too small to rescue anything
      # the compatibility rules exclude. Worst case an IMAX release still fails:
      #   DV+HDR10+  -7850 +500 = -7350   still below min_format_score -6000
      #   DV-only   -14550 +500 = -14050  still blocked
      #   1080p x265 -7850 +500 = -7350   still blocked
      # So IMAX can never override a hard exclusion, which is the requirement.
      #
      # NOTE: this is a FILENAME heuristic only. Whether the file really contains expanded
      # framing is decided by the post-import verifier in services/avrana-imax-verify/.
      - trash_ids:
          - eecf3a857724171f968a66cb5719e152          # IMAX
          - 9f6cbff8cfe4ebbc1bde14c7b7bec0de          # IMAX Enhanced
        assign_scores_to:
          - name: Avrana Compatible
            score: 500

      # POLICY: prefer HEVC at 2160p. Net effect is positive only at 2160p, because 1080p
      # HEVC also carries the -10000 above.
      - trash_ids:
          - 9170d55c319f4fe40da8711ba9d8050d
        assign_scores_to:
          - name: Avrana Compatible
            score: 300

# ------------------------------------------------------------------------------------------------
# Recyclarr -> Sonarr, following the TRaSH guides.
#
#   "Avrana TV - 1080p"   the default profile for normal TV
#   "Avrana TV - 4K"      opt-in only, generated from the TRaSH WEB-2160p template
#
# Sonarr had NO custom formats and upgrades disabled on every stock profile before this, so
# nothing here overwrites existing tuning. Sonarr's six stock profiles are left untouched.
#
# NOTHING IS ASSIGNED TO THESE PROFILES BY THIS FILE, matching the Radarr section above:
# syncing cannot start an upgrade on an existing series. Moving a series onto one of these
# profiles is a separate, deliberate act.
sonarr:
  avrana:
    base_url: http://10.0.0.218:8989
    api_key: !env_var SONARR_API_KEY

    # TRaSH size limits per quality for series. Sonarr's shipped defaults are permissive enough
    # that a tiny 1080p and a bloated one both look acceptable.
    quality_definition:
      type: series

    quality_profiles:
      # DEVIATION FROM THE TRaSH TEMPLATE, deliberate and documented.
      #
      # TRaSH's stock Sonarr profile "WEB-1080p" (trash_id 72dae194fc92bf828f32cde7744e51a1)
      # allows ONLY `WEB 1080p`; HDTV-1080p and Bluray-1080p are both `allowed: false`. That
      # cannot satisfy two of this deployment's requirements:
      #   - grab episodes promptly on release  -> needs HDTV-1080p as an accepted floor, because
      #     for broadcast shows it is often the only thing available for hours or days
      #   - upgrade toward Bluray-1080p        -> needs Bluray-1080p to be allowed at all
      #
      # So the QUALITY LADDER below is Avrana's, while ALL SCORING stays TRaSH's (the custom
      # format groups further down, at their guide default scores). Nothing here invents a score.
      - name: Avrana TV - 1080p
        score_set: default
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p

      # OPT-IN 4K. Ladder copied exactly from TRaSH's Sonarr "WEB-2160p" template
      # (trash_id d1498e7d189fbe6c7110ceaabb7473e6): WEB 2160p only, cutoff WEB 2160p. Named
      # locally so it reads as an Avrana profile next to the 1080p one; the quality set and all
      # scoring are TRaSH's. Nothing is assigned to it — 4K stays a per-title decision.
      - name: Avrana TV - 4K
        score_set: default
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p

      # ---------------------------------------------------------------------------------------
      # COMPATIBILITY-FIRST DEFAULT (added 2026-08-18). Same policy as Radarr's profile of the
      # same name. One quality group so custom-format score, not resolution tier, decides.
      # HDTV-1080p is kept as a genuinely lower tier BELOW the group so broadcast shows can still
      # be grabbed promptly without competing on equal footing with WEB/Bluray.
      - name: Avrana Compatible
        score_set: default
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Compatible 4K/1080p
          until_score: 10000
        # HDR AS LAST RESORT (2026-08-18). Chosen against the measured score landscape:
        # Measured bands after the 2026-08-18 revision:
        #   2160p SDR x265 tier1   +2650   preferred
        #   2160p SDR BluRay tier1 +2600   (TrueHD; audio is only a 150pt tiebreaker)
        #   2160p HDR10 x265 tier1 +2150   ACCEPTED as a peer, no longer penalized
        #   1080p SDR x264 tier1   +1850   fallback
        #   2160p HDR10 no tier     +450   accepted, weak source
        #   2160p DV / HDR10+      -2850   last resort only
        #   2160p DV+HDR10+        -7850   BLOCKED
        #   2160p HLG              -7850   BLOCKED
        #   1080p x265             -7850   BLOCKED (forces transcoding on this hardware)
        #   2160p DV-only         -14550   BLOCKED (worst case, wrong colours everywhere)
        # SDR outscores HDR by ~10000, so whenever both exist SDR wins outright; the threshold
        # only decides whether an HDR-only title gets nothing or gets HDR.
        min_format_score: -6000
        quality_sort: top
        qualities:
          - name: Compatible 4K/1080p
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p

      # PRE-HD / LEGACY CONTENT (added 2026-08-20). Opt-in, assigned per series, nothing uses it
      # by default.
      #
      # WHY IT EXISTS: `Avrana Compatible` has no rung below 1080p, so a series that predates HD
      # broadcast returns ZERO approved releases and sits silently at 0 episodes with no history,
      # which reads as a failure rather than an absence. Measured on two shows: House of Mouse
      # (2001) tops out at 720p, Aladdin (1994) at SD. Both returned 0 of 111 and 0 of 139.
      #
      # TWO THINGS HAVE TO BE TRUE AT ONCE, which is why lowering the floor alone is wrong:
      #   1. ONE QUALITY GROUP spanning 720p down to SD. Sonarr ranks quality TIER above custom
      #      format score, and for these shows the higher tier is usually the WRONG LANGUAGE
      #      (House of Mouse: 720p Spanish over SD English. Aladdin: 480p Greek over SD English).
      #      A tiered ladder would systematically grab the foreign copy. Collapsing them is what
      #      lets the language score decide. Same mechanism as `Avrana Compatible`.
      #   2. LANGUAGE SCORED AS AN EXCLUSION. `Language: Not English` at -10000 against
      #      min_format_score 0 is a hard rejection, not a preference.
      #
      # KNOWN BLIND SPOT, measured rather than assumed: across 344 releases from those two shows,
      # `Language: Not English` correctly rejects 127 of 127 foreign releases and misses exactly
      # 5. Those 5 are Spanish rips that Sonarr tags `[English, Spanish]` (dual), so English is
      # present and the negated language spec does not fire. Their titles are Spanish
      # ("Las historietas robadas"), but no TRaSH format catches them: MULTi keys on the literal
      # word "Multi", which they lack. With `720p` at +100 those 5 would OUTSCORE an English SD
      # copy of the same episode. If that ever matters, the fix is a hand-made custom format
      # (LanguageSpecification on Spanish, not negated, OR-ed with other languages) scored
      # -10000, which means setting reset_unmatched_scores false here so Recyclarr stops zeroing
      # it. Not done yet because it is one series' worth of edge case and unmanaged formats are
      # their own maintenance problem.
      - name: Avrana Legacy
        score_set: default
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Legacy 720p/SD
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Legacy 720p/SD
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
              - Bluray-576p
              - Bluray-480p
              - DVD
              - WEBDL-480p
              - WEBRip-480p
              - SDTV

    custom_format_groups:
      add:
        # Repack/Proper handling — TRaSH required group.
        - trash_id: 22256473b656e195eabc2798e326fbb7  # [Required] Repack/Proper
          assign_scores_to:
            - name: Avrana TV - 1080p
            - name: Avrana TV - 4K

        # WEB release-group tiers + the HD Bluray tiers. The Bluray tiers matter here because
        # this ladder ends at Bluray-1080p, unlike the stock WEB-only TRaSH profile.
        - trash_id: b4a4353e3b3e6789dbef07677ff23686  # [Release Groups] HQ
          assign_scores_to:
            - name: Avrana TV - 1080p
            - name: Avrana TV - 4K
          select:
            - e6258996055b9fbab7e9cb2f75819294  # WEB Tier 01
            - 58790d4e2fdcd9733aa7ae68ba2bb503  # WEB Tier 02
            - d84935abd3f8556dcd51d4f27e22d0a6  # WEB Tier 03
            - d0c516558625b04b363fa6c5c2c7cfd4  # WEB Scene
            - d6819cba26b1a6508138d25fb5e32293  # HD Bluray Tier 01
            - c2216b7b8aa545dc1ce8388c618f8d57  # HD Bluray Tier 02

        # Streaming-service source CFs (AMZN, ATVP, DSNP, NF, ...).
        - trash_id: abe720fab2d27682adc2a735136cec02  # [Streaming Services] General
          assign_scores_to:
            - name: Avrana TV - 1080p
            - name: Avrana TV - 4K

        # HD Streaming Boost, as requested. UHD Streaming Boost is left in at its guide default;
        # it only matches 2160p, so it is inert for the 1080p profile and correct for the 4K one.
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
          assign_scores_to:
            - name: Avrana TV - 1080p
            - name: Avrana TV - 4K

        # TRaSH unwanted / low-quality filters: AV1, BR-DISK, LQ, LQ (Release Title), Upscaled,
        # Extras, Bad Dual Groups. All guide defaults, none excluded.
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          assign_scores_to:
            - name: Avrana TV - 1080p
            - name: Avrana TV - 4K

        # CODEC COMPATIBILITY. x265 (HD) scores 1080p HEVC heavily negative. This host's Jellyfin
        # runs on an i3-6100T (Skylake / Gen9 QuickSync); 1080p HEVC is the common cause of
        # needless transcoding for clients that cannot direct-play it. This is TRaSH's own
